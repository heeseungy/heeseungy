name: Update pinned gists

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-pinned-gists
  cancel-in-progress: false

jobs:
  update:
    name: Update Gist cards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update productive and stats Gists
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PRODUCTIVE_GIST_ID: 39fb8577cc2df2228c15eb51a422e4bf
          STATS_GIST_ID: 4d9bedda66e7fe058b401160157085ee
          TIMEZONE: Asia/Seoul
          ALL_COMMITS: "true"
          K_FORMAT: "true"
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          retries: 3
          script: |
            const updatePinnedGists = require("./.github/scripts/update-pinned-gists.cjs");
            await updatePinnedGists({ github, core });
